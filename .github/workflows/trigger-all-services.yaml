name: Trigger All Services

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to trigger in target repositories
        required: true
        default: main
      workflow_file:
        description: Workflow file name to dispatch in target repositories
        required: true
        default: ci.yaml

jobs:
  trigger:
    name: Trigger ${{ matrix.repo }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo:
          - svc-adservice
          - svc-cartservice
          - svc-checkoutservice
          - svc-currencyservice
          - svc-emailservice
          - svc-frontend
          - svc-loadgenerator
          - svc-paymentservice
          - svc-productcatalogservice
          - svc-recommendationservice
          - svc-shippingservice
          - svc-svc-shoppingassistantservice
    env:
      OWNER: CloudOpsDeployment

    steps:
      - name: Trigger repository workflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ matrix.repo }}
          REF: ${{ inputs.ref }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing required secret: GH_TOKEN"
            exit 1
          fi

          payload=$(printf '{"ref":"%s"}' "$REF")
          status_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -d "$payload")

          if [ "$status_code" -ne 204 ]; then
            echo "Dispatch failed for ${OWNER}/${REPO} (HTTP ${status_code})"
            cat response.json
            exit 1
          fi

          echo "Dispatch sent for ${OWNER}/${REPO} (${WORKFLOW_FILE} @ ${REF})"