apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudops-ecommerce-app
  namespace: argocd
  # Esta annotation le dice a ArgoCD que NO borre este recurso
  # si la app que lo gestiona se elimina
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cloud ops microservices project

  # Repos Git de donde este proyecto puede leer manifests
  sourceRepos:
    - "https://github.com/CloudOpsDeployment/gitops"
    - "https://aws.github.io/eks-charts"
    - "https://charts.external-secrets.io"
    - "https://prometheus-community.github.io/helm-charts"

  # Clusters y namespaces donde puede desplegar
  destinations:
    - namespace: cloudops-ecommerce-app
      server: https://kubernetes.default.svc  # El cluster local donde vive ArgoCD
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc

  # Qué recursos Kubernetes puede crear este proyecto
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "networking.k8s.io"
      kind: IngressClass
    - group: "gateway.networking.k8s.io"
      kind: GatewayClass
    - group: "elbv2.k8s.aws"
      kind: IngressClassParams
    - group: "external-secrets.io"
      kind: ClusterSecretStore
    - group: "storage.k8s.io"
      kind: StorageClass

  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: StatefulSet
    - group: "apps"
      kind: DaemonSet
    - group: "batch"
      kind: Job
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Secret
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ConfigMap
    - group: "rbac.authorization.k8s.io"
      kind: Role
    - group: "rbac.authorization.k8s.io"
      kind: RoleBinding
    - group: "policy"
      kind: PodDisruptionBudget
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "gateway.networking.k8s.io"
      kind: Gateway
    - group: "gateway.networking.k8s.io"
      kind: HTTPRoute
    - group: "gateway.networking.k8s.io"
      kind: "*"
    - group: "gateway.k8s.aws"
      kind: "TargetGroupConfiguration"
    - group: "gateway.k8s.aws"
      kind: "LoadBalancerConfiguration"
    - group: "external-secrets.io"
      kind: ExternalSecret
    - group: "external-secrets.io"
      kind: SecretStore
    - group: "monitoring.coreos.com"
      kind: "*"
    - group: argoproj.io
      kind: Application