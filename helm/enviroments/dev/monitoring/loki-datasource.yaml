apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    # Esta label es mágica — Grafana la detecta y carga el datasource automáticamente
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-stack:3100
        isDefault: false
        jsonData:
          maxLines: 1000