nameOverride: frontend

image:
  repository: "224039895989.dkr.ecr.us-east-1.amazonaws.com/cloudops-ecommerce-app-frontend-ecr-repo"
  tag: "latest"

containerName: server
containerPort: 8080
portName: http

service:
  enabled: true
  # AWS LBC en Gateway API usa targetType=instance por defecto; requiere NodePort o LoadBalancer.
  type: NodePort
  port: 80
  targetPort: 8080
  portName: http

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

env:
  - name: PORT
    value: "8080"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice:3550"
  - name: CURRENCY_SERVICE_ADDR
    value: "currencyservice:7000"
  - name: CART_SERVICE_ADDR
    value: "cartservice:7070"
  - name: RECOMMENDATION_SERVICE_ADDR
    value: "recommendationservice:8080"
  - name: SHIPPING_SERVICE_ADDR
    value: "shippingservice:50051"
  - name: CHECKOUT_SERVICE_ADDR
    value: "checkoutservice:5050"
  - name: AD_SERVICE_ADDR
    value: "adservice:9555"
  - name: SHOPPING_ASSISTANT_SERVICE_ADDR
    value: "shoppingassistantservice:80"
  - name: ENV_PLATFORM
    value: "aws"
  - name: ENABLE_PROFILER
    value: "0"

terminationGracePeriodSeconds: 5

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true

livenessProbe:
  httpGet:
    path: "/_healthz"
    port: 8080
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: "/_healthz"
    port: 8080
  initialDelaySeconds: 10