nameOverride: adservice

image:
  repository: "224039895989.dkr.ecr.us-east-1.amazonaws.com/cloudops-ecommerce-app-adservice-ecr-repo"
  tag: "latest"

containerName: server
containerPort: 9555
portName: grpc

service:
  enabled: true
  type: ClusterIP
  port: 9555
  targetPort: 9555
  portName: grpc

resources:
  requests:
    cpu: "200m"
    memory: "180Mi"
  limits:
    cpu: "300m"
    memory: "300Mi"

env:
  - name: PORT
    value: "9555"

terminationGracePeriodSeconds: 5

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true


livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 15
  grpc:
    port: 9555
readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 15
  grpc:
    port: 9555

serviceAccount:
  create: true
  name: adservice