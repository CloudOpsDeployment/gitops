apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: online-boutique-gateway
  namespace: cloudops-ecommerce-app
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: internet-facing-config
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same