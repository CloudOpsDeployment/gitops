nameOverride: recommendationservice

image:
  repository: "224039895989.dkr.ecr.us-east-1.amazonaws.com/cloudops-ecommerce-app-recommendationservice-ecr-repo"
  tag: "latest"

containerName: server
containerPort: 8080
portName: grpc

service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
  portName: grpc

resources:
  requests:
    cpu: "100m"
    memory: "220Mi"
  limits:
    cpu: "200m"
    memory: "450Mi"

env:
  - name: PORT
    value: "8080"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice:3550"
  - name: DISABLE_PROFILER
    value: "1"

terminationGracePeriodSeconds: 5

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true

readinessProbe:
  periodSeconds: 5
  grpc:
    port: 8080

livenessProbe:
  periodSeconds: 5
  grpc:
    port: 8080

serviceAccount:
  create: true
  name: recommendationservice
